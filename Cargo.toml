[package]
name = "adhs-expert"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "uebersicht"
path = "src/uebersicht.rs"

[[bin]]
name = "scannen"
path = "src/scannen.rs"

[dependencies]
anyhow = "1"
genpdf = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
lopdf = "0.34"
regex = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"
objc2-vision = "0.3"
