[package]
name = "adhs-expert"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "uebersicht"
path = "src/uebersicht.rs"

[[bin]]
name = "scannen"
path = "src/scannen.rs"

[[bin]]
name = "scanliste"
path = "src/scanliste.rs"

[[bin]]
name = "eintragen"
path = "src/eintragen.rs"

[[bin]]
name = "mail"
path = "src/mail.rs"

[dependencies]
anyhow = "1"
genpdf = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lopdf = "0.34"
regex = "1"
base64 = "0.22"
serde_json = "1"
ureq = { version = "2", features = ["json"] }
